version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
    - API_KEY=${API_KEY}
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  test:
    build: .
    command: pytest 
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY}
    depends_on:
      - mongodb
    volumes:
      - .:/app
    restart: "no"
    
volumes:
  mongodb_data: